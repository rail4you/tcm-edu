# tcm-edu nginx 站点配置
#
# 公网只开放 80/443，本机 nginx 反代 Phoenix 容器（127.0.0.1:4000）。
# 部署到服务器：复制到 /etc/nginx/sites-available/tcm-edu.conf
#   sudo cp tcm-edu.conf /etc/nginx/sites-available/tcm-edu.conf
#   sudo ln -sf /etc/nginx/sites-available/tcm-edu.conf /etc/nginx/sites-enabled/tcm-edu.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 关键点：
#   * proxy_http_version 1.1 + Upgrade/Connection 头 —— Phoenix LiveView
#     依赖 WebSocket（/live/websocket），缺了会握手失败（浏览器报
#     "WebSocket connection to .../live/websocket ... failed"）。
#   * client_max_body_size —— 课程封面上传（AshStorage）需要较大的 body。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/tcm-edu.access.log;
    error_log  /var/log/nginx/tcm-edu.error.log;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        # Phoenix LiveView WebSocket（/live/websocket）需要这两个头
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ── HTTPS（可选，443）────────────────────────────────────────
